name: ci

on:
  workflow_dispatch: {}
  push:
  pull_request:

jobs:
  borrow-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tools of the audit
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unrar unzip
      - uses: actions/cache@v4
        with:
          path: |
            build/corpora
            build/audit-cache
          key: corpora-${{ hashFiles('tools/audit/fetch-corpora.sh') }}
      - name: Reference corpora
        run: tools/audit/fetch-corpora.sh
      - name: The tree has nothing of the corpora (tools/audit/borrow-audit.py)
        run: python3 tools/audit/borrow-audit.py --ref build/corpora/list.txt src app tests tools
      - name: Every commit of the push has nothing of the corpora
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"; else range=HEAD; fi
          python3 tools/audit/borrow-audit.py --ref build/corpora/list.txt --git-range "$range"
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-base fp-units-misc fp-units-fcl python3
      - name: Generated language data is up to date
        run: |
          python3 tools/gen-langs.py
          git diff --exit-code src/tvelangdata.inc
      - name: Unit tests
        env:
          TV_REF: claude/nifty-rubin-7v0d9z
        run: tools/test.sh
      - name: The tve program builds
        env:
          TV_REF: claude/nifty-rubin-7v0d9z
        run: |
          . tools/need-tv.sh
          mkdir -p build/app
          fpc -Fusrc -Fu"$TVSRC" -Fi"$TVSRC" -FUbuild/app -FEbuild/app app/tve.pas
      - name: The tve program in a pty (the menu keys, the words of the guidelines)
        run: python3 tests/pty/test_app.py build/app/tve
