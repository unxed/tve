name: ci

on:
  workflow_dispatch: {}
  push:
  pull_request:

jobs:

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-base fp-units-misc fp-units-fcl python3
      - name: Paths are spelled only by TvPath of tv3 (a ratchet; tools/paths-baseline.txt)
        run: python3 tools/check-paths.py
      - name: Generated language data is up to date
        run: |
          python3 tools/gen-langs.py
          git diff --exit-code src/tvelangdata.inc
      - name: Unit tests
        env:
          TV_REF: claude/nifty-rubin-7v0d9z
        run: tools/test.sh
      - name: The tve program builds
        env:
          TV_REF: claude/nifty-rubin-7v0d9z
        run: tools/pty-test.sh --build
      # the groups of the test in a pty wait for the program, not for the CPU: they run side by side, each with a HOME of its own
      - name: The tve program in a pty (the menu keys, the words of the guidelines, the state of the files)
        env:
          CMDS: |
            python3 tests/pty/test_app.py build/app/tve menu
            python3 tests/pty/test_app.py build/app/tve words
            python3 tests/pty/test_app.py build/app/tve state
        run: tools/ci-par.sh
